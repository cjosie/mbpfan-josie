[general]
# See the comments below for guidance on choosing values.
#
# mbpfan will load the min / max speed of each fan from the fan_min / fan_max
# files exposed by the applesmc driver. If these are not found it will use the
# defaults min_speed = 500 and max_speed = 6500. Setting the speed values in
# this config overrides whatever it finds there.
#
# multiple fans can be configured by using the config keys min_fan*_speed and
# max_fan*_speed; the number correlates to the fan number in the applesmc driver.
#
# Setting min_fan*_speed to 0 stops that fan while the temperature is at or
# below low_temp. The SMC ramps the fan back up smoothly when the temperature
# rises again (verified: no snap to the SMC minimum, no surge).
#
#min_fan1_speed = 0	# 0 = stop fan below low_temp
#max_fan1_speed = 6500	# highest value of the fan's fan_max sysfs file

# temperature units in celcius
low_temp = 63			# if temperature is below this, fans will run at minimum speed (or stop, if min_fanN_speed = 0)
high_temp = 66			# if temperature is above this, fan speed will gradually increase
max_temp = 86			# if temperature is above this, fans will run at maximum speed
polling_interval = 1	# default is 1 seconds
